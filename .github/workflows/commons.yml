name: commons-fetch
on:
  push:
    paths: ['commons/files.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download from Wikimedia Commons
        run: |
          mkdir -p commons/img
          i=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            i=$((i+1))
            enc=$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1].replace(' ','_')))" "$f")
            out="commons/img/$(python3 -c "import sys,hashlib;print(hashlib.md5(sys.argv[1].encode()).hexdigest()[:12])" "$f").jpg"
            curl -sSL -A "NaplesSorted/1.0 (info@getnaplessorted.com)" -o "$out" "https://commons.wikimedia.org/wiki/Special:FilePath/${enc}?width=1800" || echo "fail $f"
            echo "$f -> $out $(stat -c%s "$out")"
            sleep 1
          done < commons/files.txt
      - name: Commit
        run: |
          git config user.name naplessorted
          git config user.email info@getnaplessorted.com
          git add commons/img
          git commit -m "Commons images" || true
          git push
